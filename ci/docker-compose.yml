version: "3.9"

services:
  test:
    build:
      context: ..
      dockerfile: ci/Dockerfile
    working_dir: /pandas
    volumes:
      - ..:/pandas
    environment:
      PYTEST_WORKERS: 4          # چنتا worker میخوای؟
      TEST_ARGS: ""              # آرگومان اضافی pytest
      TEST_TARGET: ""            # پوشه مشخص مثلاً pandas/core
      PATTERN: ""                # marker انتخابی مثل groupby
    command: ["ci/run_tests.sh"]
